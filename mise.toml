# Toolchain for the scripts in this repo. Tools also pin these in their shebang
# so they work from any directory once symlinked into ~/.local/bin:
#   python: #!/usr/bin/env -S mise exec python@3.13 uv@0.9 -- uv run --quiet --script
#   node:   #!/usr/bin/env -S mise exec node@22 -- node
# Keep the two in step when bumping a version.
[tools]
node = "22"
python = "3.13"
uv = "0.9"

[tasks.install]
description = "Install Node deps and symlink every tool into ~/.local/bin"
run = "./install.sh"
